name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CI: false
  ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
  USE_HARD_LINKS: false
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: mac-arm64
          - os: macos-13
            arch: x64
            target: mac-x64
          - os: windows-latest
            arch: x64
            target: win-x64
          - os: ubuntu-latest
            arch: x64
            target: linux-x64

    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libglib2.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev \
            libnotify-dev libnss3 libxss1 libxtst6 xvfb \
            libcairo2-dev libpango1.0-dev librsvg2-dev \
            libgif-dev libavif-dev

      - name: Install dependencies
        run: npm install

      - name: Build (${{ matrix.target }})
        run: >
          npx electron-builder
          --${{ contains(matrix.target, 'mac') && 'mac' || contains(matrix.target, 'win') && 'win' || 'linux' }}
          --publish never
          --config.extraMetadata.main=main.js

      - name: Create or update GitHub release
        if: runner.os == 'macOS'
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" *.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml --clobber

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" converter-*-win-x64.exe converter-*-win-x64.exe.blockmap latest.yml --clobber

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" converter-*-linux-x86_64.AppImage converter-*-linux-amd64.deb latest-linux.yml --clobber
